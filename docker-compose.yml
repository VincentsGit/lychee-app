services:
  backend:
    build: ./backend
    container_name: flask_app_v2
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/tmp-uploads:/app/tmp-uploads
      - ./backend/instance:/app/instance
    environment:
      - FLASK_ENV=production
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - STEAM_ID=${STEAM_ID:-}

  frontend:
    build: ./frontend
    container_name: react_app_v2
    ports:
      - "8443:8443"   # HTTPS port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/lychee.blog/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/lychee.blog/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - backend
